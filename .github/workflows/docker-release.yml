name: Build Multi-arch Docker Image

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*'
  # master/main 分支改为手工触发（Actions 页面点 Run workflow）
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/proxypool

# 同一 ref 的并发运行取消旧任务，避免重复触发时浪费构建资源
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      # 显式缓存 Go 模块与构建缓存：key 含 go.sum 哈希，restore-keys 用前缀兜底，
      # 避免 setup-go 的 cache 偶发“Cache is not found”导致每次重下依赖/重编译。
      - name: Cache Go modules & build cache
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/go/pkg/mod
            /home/runner/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Run vet & tests
        run: |
          go vet ./...
          go test ./... 2>&1 | tail -30

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-') }}

      # 缓存 tag 按 ISO 周滚动：本周写缓存，cache-from 用 本周+上周 双 ref 兜底，
      # 便于定时清理旧的 buildcache-* 时仍能命中近期缓存。
      - name: Compute build cache refs
        id: cache
        run: |
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
          echo "prev=$(date -u -d 'last week' +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          # 缓存改用 registry 并按周滚动：跨 tag/多平台稳定命中，且便于定时清理
          cache-from: |
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ steps.cache.outputs.week }}
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ steps.cache.outputs.prev }}
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ steps.cache.outputs.week }},mode=max
