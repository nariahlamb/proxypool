name: Prune Docker registry build cache

on:
  schedule:
    # 每天 04:00 UTC 清理一次
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale buildcache tags
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPO: proxypool
        run: |
          python3 - <<'PY'
          import os, json, datetime, urllib.request, urllib.error, urllib.parse

          NS = os.environ["HUB_USER"]
          REPO = os.environ["REPO"]
          PASS = os.environ["HUB_TOKEN"]
          API = "https://hub.docker.com/v2"

          def call(method, path, body=None, token=None):
              req = urllib.request.Request(API + path, method=method)
              if body is not None:
                  req.data = json.dumps(body).encode()
                  req.add_header("Content-Type", "application/json")
              if token:
                  req.add_header("Authorization", "JWT " + token)
              try:
                  with urllib.request.urlopen(req) as r:
                      txt = r.read().decode()
                      return r.status, (json.loads(txt) if txt else {})
              except urllib.error.HTTPError as e:
                  return e.code, {}

          # Docker Hub API 需要用用户名/密码(这里密码是 PAT)换 JWT
          st, data = call("POST", "/users/login/", {"username": NS, "password": PASS})
          if st != 200 or not data.get("token"):
              print("docker hub login failed:", st)
              raise SystemExit(1)
          tok = data["token"]

          # 收集所有 buildcache-* 标签及其最后更新时间
          tags = []
          page = 1
          while True:
              st, d = call("GET", f"/repositories/{NS}/{REPO}/tags/?page_size=100&page={page}", token=tok)
              if st != 200:
                  break
              for t in d.get("results", []):
                  name = t.get("name", "")
                  if not name.startswith("buildcache"):
                      continue
                  lu = t.get("last_updated")
                  if not lu:
                      continue
                  try:
                      dt = datetime.datetime.fromisoformat(lu.replace("Z", "+00:00"))
                  except Exception:
                      continue
                  tags.append((name, dt))
              if not d.get("next"):
                  break
              page += 1

          # 只保留最新的一个 buildcache 标签，其余删除，控制 Docker Hub 缓存体积
          if tags:
              keep = max(tags, key=lambda x: x[1])[0]
              deleted = []
              for name, _ in tags:
                  if name == keep:
                      continue
                  call("DELETE", f"/repositories/{NS}/{REPO}/tags/{urllib.parse.quote(name)}/", token=tok)
                  deleted.append(name)
              print("keep latest buildcache tag:", keep)
              print("deleted:", ", ".join(deleted) or "none")
          else:
              print("no buildcache tags to prune")
          PY
