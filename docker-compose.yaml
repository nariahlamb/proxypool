# ProxyPool Docker Compose 示例
#
# 用法：
#   1. 准备配置文件：把 config/config.yaml、config/source.yaml 复制到本文件同级目录
#      （或用下方 volumes 里的路径）
#   2. 启动：docker compose up -d
#   3. 访问：http://<宿主机IP>:12580
#
# 说明：
#   - GeoIP 数据库已内置在镜像中（v2.5.2+），无需挂载 assets 目录
#   - 挂载 config.yaml / source.yaml / data 便于宿主机独立管理配置与数据
#   - 如需站点挂载在子路径（如 /show/），在 config.yaml 配置 base_path（自动适配，无需手动）
#   - 任务接口鉴权：在 config.yaml 配置 admin_token；优选订阅鉴权：配置 best_token
#
# 网络模式（重要）：
#   默认使用 host 网络——容器直接共享宿主机网络栈：
#     - IPv4 + IPv6 出口均可用（IPv6 优选节点健康检查可正常工作）
#     - 无需 ports 映射，服务直接监听宿主机 12580 端口
#     - 若宿主机无 IPv6 出口，程序会自动跳过 IPv6 节点探测（日志提示，不影响使用）
#   如希望保持端口隔离（仅 IPv4 即可），可改用默认 bridge：
#     删除下方 network_mode 行，并取消 ports 映射注释

services:
  proxypool:
    # 镜像名（Docker Hub 构建产物；如使用私有镜像仓库请自行替换）
    image: bineyond/proxypool:latest
    container_name: proxypool
    hostname: proxypool
    restart: always
    tty: true
    network_mode: host
    # 使用 bridge 网络（仅 IPv4）时取消注释：
    # ports:
    #   - "12580:12580"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 配置文件（宿主路径请按实际调整）
      - ./config.yaml:/app/config/config.yaml
      - ./source.yaml:/app/config/source.yaml
      # 数据目录（SQLite 数据库 / 日志），需持久化
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:12580/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
